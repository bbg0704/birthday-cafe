<!DOCTYPE html>
<html lang="zh-CN">

    <link rel="stylesheet" href="css/style.css?v=final9">
    <link rel="preconnect" href="https://fonts.googleapis.com">

                        <path d="M43 30c5.5.5 9 3.5 8.5 8-.5 4.5-4.5 7-9 6.5" stroke="#7C5233" stroke-width="3" stroke-linecap="round"/>

                        <!-- 咖啡豆 -->
                        <ellipse cx="51" cy="51" rx="6" ry="7.5" transform="rotate(25 51 51)" fill="#A0714F"/>
                        <path d="M48 45.5c3 3.5 4.5 7 4 11.5" stroke="#FAF5EC" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="logo-text">生咖 <em>Birthday Cafe</em></span>
            </a>
            <nav class="nav-links" id="nav-links">
                <a href="#/" class="nav-item" data-route data-nav-home>探索生咖</a>
                <a href="#/my" class="nav-item" data-route data-nav-my>我的生咖</a>
            </nav>
            <div class="nav-auth" id="nav-auth"></div>
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="菜单">

        <div class="mobile-menu" id="mobile-menu"></div>

    <!-- 主内容区 -->
    <main id="app"></main>

    <!-- Toast 通知 -->
    <div id="toast-container"></div>

    <!-- Modal 容器 -->
    <div id="modal-overlay" class="modal-overlay hidden">

    </div>

    <script src="js/qrcode.js?v=final9"></script>
    <script src="js/data.js?v=final9"></script>

    <script src="js/app.js?v=final9"></script>
